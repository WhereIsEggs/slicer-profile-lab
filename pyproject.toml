[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slicer-profile-lab"
version = "0.1.0"
description = "Validate and compare OrcaSlicer profile sets."
readme = "README.md"
requires-python = ">3.11"
dependencies = []

[project.scripts]
profilelab = "profilelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]