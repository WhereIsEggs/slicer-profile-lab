[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slicer-profile-lab"
version = "0.1.0"
description = "Validate and compare OrcaSlicer profile sets."
readme = "README.md"
requires-python = ">3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.10,<7", "psutil>=7,<8"]

[project.scripts]
profilelab = "profilelab.cli:main"

[project.gui-scripts]
profilelab-desktop = "profilelab.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
